<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>DRIVER</title>
<style>
  :root{
    --bg:#080808;
    --panel:#101010;
    --road:#171717;
    --line:#d8d0bf;
    --text:#f0eadc;
    --muted:#8d877d;
    --red:#8f1515;
    --red-bright:#c52828;
    --border:#2a2926;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:"Courier New", Courier, monospace;
  }

  body{
    min-height:100vh;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:
      radial-gradient(circle at 50% 35%, rgba(255,255,255,.025), transparent 35%),
      linear-gradient(#090909,#050505);
  }

  button{
    font:inherit;
  }

  body{
    -webkit-user-select:none;
    user-select:none;
  }

  .result-canvas{
    display:block;
    max-width:100%;
    height:auto;
    pointer-events:none;
  }

  .small-result-canvas{
    width:180px;
    height:30px;
  }

  .final-result-canvas{
    width:min(360px,82vw);
    height:auto;
    margin:0 auto;
  }

  .screen{
    display:none;
    width:min(760px, 96vw);
    height:min(760px, 92vh);
    min-height:560px;
    overflow:hidden;
    border:1px solid #24221f;
    background:#080808;
  }

  .screen.active{
    display:flex;
  }

  
  #startScreen{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:28px;
    padding:24px;
  }

  .title{
    margin:0;
    font-size:clamp(52px,11vw,112px);
    letter-spacing:.12em;
    text-indent:.12em;
    font-weight:900;
    line-height:.9;
    text-shadow:0 3px 0 #000;
  }

  .rule{
    width:min(360px,70vw);
    height:1px;
    background:linear-gradient(90deg,transparent,var(--muted),transparent);
  }

  .primary{
    min-width:180px;
    min-height:56px;
    padding:14px 34px;
    border:1px solid #48433b;
    background:var(--text);
    color:#0b0b0b;
    font-weight:900;
    font-size:18px;
    letter-spacing:.14em;
    cursor:pointer;
    transition:transform .08s ease, background .12s ease;
  }

  .primary:active{
    transform:translateY(2px);
    background:#d7cfbf;
  }

  
  #gameScreen{
    flex-direction:column;
    min-height:100vh;
    position:relative;
  }

  .topbar{
    height:54px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--border);
    background:#090909;
    letter-spacing:.08em;
    font-size:14px;
    color:var(--muted);
    z-index:10;
  }

  .topbar strong{
    color:var(--text);
    font-size:15px;
  }

  .road-wrap{
    position:relative;
    flex:1 1 auto;
    min-height:280px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#060606;
  }

  .road{
    position:absolute;
    inset:-10% 15%;
    clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);
    background:
      linear-gradient(90deg,
        transparent 0 48.5%,
        rgba(231,224,207,.9) 48.5% 51.5%,
        transparent 51.5% 100%);
    background-color:var(--road);
    background-size:100% 120px;
    animation:roadMove .55s linear infinite;
    filter:drop-shadow(0 0 18px rgba(0,0,0,.8));
  }

  .road::before,
  .road::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    width:2px;
    background:rgba(240,234,220,.55);
  }

  .road::before{left:5%}
  .road::after{right:5%}

  @keyframes roadMove{
    from{background-position-y:0}
    to{background-position-y:120px}
  }

  .city{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.5;
    background:
      linear-gradient(90deg, #0b0b0b 0 13%, transparent 13% 87%, #0b0b0b 87% 100%),
      repeating-linear-gradient(90deg,
        transparent 0 8%,
        rgba(255,255,255,.025) 8% 8.5%,
        transparent 8.5% 16%);
  }

  .command{
    position:absolute;
    top:12%;
    left:50%;
    transform:translateX(-50%);
    width:min(700px,90%);
    text-align:center;
    z-index:6;
    user-select:none;
  }

  .hazard{
    min-height:26px;
    color:#f6efe2;
    font-size:clamp(14px,2vw,19px);
    font-weight:900;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:10px;
    text-shadow:
      0 2px 0 #000,
      0 0 8px rgba(0,0,0,.95),
      0 0 16px rgba(0,0,0,.75);
  }

  .instruction{
    min-height:60px;
    color:#fff8ea;
    font-size:clamp(38px,8vw,78px);
    line-height:.95;
    font-weight:900;
    letter-spacing:.08em;
    text-indent:.08em;
    -webkit-text-stroke:1px rgba(0,0,0,.85);
    text-shadow:
      0 4px 0 #000,
      0 0 10px rgba(0,0,0,.95),
      0 0 22px rgba(0,0,0,.8);
    opacity:0;
    transform:scale(.96);
    transition:opacity .08s ease, transform .08s ease;
  }

  .instruction.show{
    opacity:1;
    transform:scale(1);
  }

  .instruction.wrong{
    color:#f0eadc;
    text-shadow:
      2px 0 0 var(--red-bright),
      -2px 0 0 var(--red-bright),
      0 4px 0 #000;
  }

  .status{
    position:absolute;
    top:52%;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    min-height:24px;
    font-size:14px;
    font-weight:900;
    letter-spacing:.12em;
    color:var(--red-bright);
    text-align:center;
    opacity:0;
    transition:opacity .08s ease;
  }

  .status.show{opacity:1}

  .car{
    position:absolute;
    left:50%;
    bottom:27%;
    transform:translateX(-50%);
    width:74px;
    height:112px;
    z-index:5;
    animation:carIdle .9s ease-in-out infinite alternate;
    transform-origin:50% 78%;
    will-change:transform;
  }

  @keyframes carIdle{
    from{transform:translateX(-50%) translateY(0)}
    to{transform:translateX(-50%) translateY(-2px)}
  }

  .car-effects{
    position:absolute;
    left:50%;
    bottom:22%;
    width:190px;
    height:150px;
    transform:translateX(-50%);
    z-index:4;
    pointer-events:none;
  }

  .smoke{
    position:absolute;
    left:50%;
    bottom:7px;
    width:26px;
    height:22px;
    transform:translateX(-50%);
    border-radius:50%;
    background:rgba(220,220,210,.46);
    filter:blur(3px);
    opacity:0;
  }

  .smoke::before,
  .smoke::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(220,220,210,.36);
    filter:blur(4px);
  }

  .smoke::before{
    width:40px;
    height:32px;
    left:-38px;
    top:5px;
  }

  .smoke::after{
    width:36px;
    height:30px;
    left:28px;
    top:8px;
  }

  .speed-lines{
    position:absolute;
    inset:-4px 0 0;
    opacity:0;
  }

  .speed-lines::before,
  .speed-lines::after{
    content:"";
    position:absolute;
    top:8px;
    bottom:0;
    width:5px;
    border-radius:3px;
    background:linear-gradient(
      to bottom,
      transparent 0%,
      rgba(245,239,225,.16) 15%,
      rgba(245,239,225,.78) 50%,
      rgba(245,239,225,.14) 85%,
      transparent 100%
    );
    filter:blur(.4px);
  }

  .speed-lines::before{left:30px}
  .speed-lines::after{right:30px}

  .road-wrap.braking .smoke{
    animation:smokeBurst .95s ease-out both;
  }

  .road-wrap.accelerating .speed-lines{
    animation:speedFlash .9s ease-out both;
  }

  @keyframes smokeBurst{
    0%{
      opacity:0;
      transform:translateX(-50%) translateY(0) scale(.35);
    }
    18%{opacity:.9}
    50%{
      opacity:.72;
      transform:translateX(-50%) translateY(14px) scale(1.15);
    }
    100%{
      opacity:0;
      transform:translateX(-50%) translateY(34px) scale(1.9);
    }
  }

  @keyframes speedFlash{
    0%{opacity:0; transform:scaleY(.55)}
    16%{opacity:.95}
    56%{opacity:.72; transform:scaleY(1.05)}
    100%{opacity:0; transform:scaleY(1.35)}
  }

  .car-body{
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,#1b1b1b,#3a3a3a 48%,#151515);
    border:2px solid #050505;
    border-radius:24px 24px 14px 14px;
    box-shadow:0 9px 22px rgba(0,0,0,.6);
  }

  .car-body::before{
    content:"";
    position:absolute;
    left:12px;
    right:12px;
    top:18px;
    height:34px;
    background:#080808;
    border:2px solid #242424;
    clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);
  }

  .car-body::after{
    content:"";
    position:absolute;
    left:10px;
    right:10px;
    bottom:12px;
    height:7px;
    background:linear-gradient(90deg,var(--red-bright) 0 26%,transparent 26% 74%,var(--red-bright) 74% 100%);
  }

  .car.left{
    animation:laneLeft .98s cubic-bezier(.22,.7,.2,1) both;
  }

  .car.right{
    animation:laneRight .98s cubic-bezier(.22,.7,.2,1) both;
  }

  .car.brake{
    animation:brakeMove .98s cubic-bezier(.22,.7,.2,1) both;
  }

  .car.accelerate{
    animation:accelerateMove .92s cubic-bezier(.22,.7,.2,1) both;
  }

  @keyframes laneLeft{
    0%{transform:translateX(-50%) translateY(0)}
    38%{transform:translateX(calc(-50% - 82px)) translateY(-1px)}
    64%{transform:translateX(calc(-50% - 82px)) translateY(-1px)}
    100%{transform:translateX(-50%) translateY(0)}
  }

  @keyframes laneRight{
    0%{transform:translateX(-50%) translateY(0)}
    38%{transform:translateX(calc(-50% + 82px)) translateY(-1px)}
    64%{transform:translateX(calc(-50% + 82px)) translateY(-1px)}
    100%{transform:translateX(-50%) translateY(0)}
  }

  @keyframes brakeMove{
    0%{transform:translateX(-50%) translateY(0) scale(1)}
    28%{transform:translateX(-50%) translateY(18px) scale(.99)}
    66%{transform:translateX(-50%) translateY(18px) scale(.99)}
    100%{transform:translateX(-50%) translateY(0) scale(1)}
  }

  @keyframes accelerateMove{
    0%{transform:translateX(-50%) translateY(0) scale(1)}
    28%{transform:translateX(-50%) translateY(-22px) scale(1.02)}
    62%{transform:translateX(-50%) translateY(-22px) scale(1.02)}
    100%{transform:translateX(-50%) translateY(0) scale(1)}
  }

  .road-wrap.braking .road{
    animation-duration:1.55s;
  }

  .road-wrap.accelerating .road{
    animation-duration:.27s;
  }

  .road-wrap.braking .car-body::after{
    box-shadow:
      0 0 7px rgba(197,40,40,.9),
      0 0 14px rgba(197,40,40,.55);
  }

  .road-wrap.accelerating .car-body{
    box-shadow:
      0 9px 22px rgba(0,0,0,.6),
      0 12px 18px rgba(235,225,205,.12);
  }

  .controls{
    flex:none;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:16px;
    background:#090909;
    border-top:1px solid var(--border);
  }

  .control{
    min-height:88px;
    border:1px solid #4a463f;
    background:#121212;
    color:var(--text);
    font-size:clamp(18px,3vw,24px);
    font-weight:900;
    letter-spacing:.08em;
    cursor:pointer;
    touch-action:manipulation;
    user-select:none;
    transition:background .06s ease, transform .06s ease, border-color .06s ease;
  }

  .control:active,
  .control.pressed{
    transform:translateY(2px);
    background:#1f1f1f;
    border-color:#6b6256;
  }

  .control[disabled]{
    opacity:.42;
    cursor:default;
  }

  
  #endScreen{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:28px 20px;
  }

  .end-wrap{
    width:min(520px,100%);
    text-align:center;
  }

  .end-title{
    margin:0 0 30px;
    font-size:clamp(40px,8vw,72px);
    letter-spacing:.1em;
    text-indent:.1em;
    line-height:.95;
  }

  .results{
    border-top:1px solid #3d3932;
    border-bottom:1px solid #3d3932;
    padding:18px 0;
    margin-bottom:22px;
  }

  .result-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:8px 4px;
    color:var(--muted);
    font-size:14px;
    letter-spacing:.06em;
  }

  .result-row strong{
    color:var(--text);
    font-size:16px;
  }

  .result-row .small-result-canvas{
    flex:none;
  }

  .final-time{
    margin:26px 0 32px;
  }

  .final-time .label{
    display:block;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.16em;
    margin-bottom:7px;
  }

  .final-time .unit{
    display:block;
    margin-top:6px;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.14em;
  }

  .shake{
    animation:shake .18s linear 1;
  }

  @keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    50%{transform:translateX(7px)}
    75%{transform:translateX(-4px)}
    100%{transform:translateX(0)}
  }

  @media (max-width:600px){
    body{
      padding:8px;
    }

    .screen{
      width:100%;
      height:calc(100vh - 16px);
      min-height:520px;
    }

    .topbar{
      height:48px;
      padding:0 12px;
      font-size:12px;
    }

    .topbar strong{font-size:13px}

    .road{
      inset:-8% 4%;
    }

    .command{
      top:13%;
    }

    .car{
      bottom:25%;
      width:62px;
      height:96px;
    }

    .car-effects{
      bottom:20%;
      width:150px;
      height:125px;
    }

    @keyframes laneLeft{
      0%{transform:translateX(-50%) translateY(0)}
      38%{transform:translateX(calc(-50% - 58px)) translateY(-1px)}
      64%{transform:translateX(calc(-50% - 58px)) translateY(-1px)}
      100%{transform:translateX(-50%) translateY(0)}
    }

    @keyframes laneRight{
      0%{transform:translateX(-50%) translateY(0)}
      38%{transform:translateX(calc(-50% + 58px)) translateY(-1px)}
      64%{transform:translateX(calc(-50% + 58px)) translateY(-1px)}
      100%{transform:translateX(-50%) translateY(0)}
    }

    .controls{
      padding:12px;
      gap:9px;
    }

    .control{
      min-height:78px;
      font-size:17px;
    }
  }

  @media (prefers-reduced-motion:reduce){
    .road,.car{animation:none}
    .instruction,.car,.status,.control,.primary{transition:none}
    .shake{animation:none}
  }
</style>
</head>
<body>

<section id="startScreen" class="screen active">
  <h1 class="title">DRIVER</h1>
  <div class="rule"></div>
  <button id="startBtn" class="primary" type="button">START</button>
</section>

<section id="gameScreen" class="screen">
  <div class="topbar">
    <span>REACTION <strong id="reactionCount">0 / 55</strong></span>
    <span>MISTAKES <strong id="mistakeCount">0</strong></span>
  </div>

  <div id="roadWrap" class="road-wrap">
    <div class="city"></div>
    <div class="road"></div>

    <div class="command">
      <div id="hazardText" class="hazard"></div>
      <div id="instructionText" class="instruction"></div>
    </div>

    <div id="statusText" class="status"></div>

    <div class="car-effects" aria-hidden="true">
      <div class="smoke"></div>
      <div class="speed-lines"></div>
    </div>

    <div id="car" class="car" aria-hidden="true">
      <div class="car-body"></div>
    </div>
  </div>

  <div class="controls" aria-label="Driving controls">
    <button class="control" type="button" data-action="LEFT" disabled>◀ LEFT</button>
    <button class="control" type="button" data-action="RIGHT" disabled>RIGHT ▶</button>
    <button class="control" type="button" data-action="BRAKE" disabled>■ BRAKE</button>
    <button class="control" type="button" data-action="ACCELERATE" disabled>ACCELERATE ▲</button>
  </div>
</section>

<section id="endScreen" class="screen">
  <div class="end-wrap">
    <h2 class="end-title">GETAWAY COMPLETE</h2>

    <div class="results">
      <div class="result-row">
        <span>REACTION TIME</span>
        <canvas id="reactionTimeResult" class="result-canvas small-result-canvas" width="360" height="60"></canvas>
      </div>
      <div class="result-row">
        <span>PENALTIES</span>
        <canvas id="penaltyResult" class="result-canvas small-result-canvas" width="360" height="60"></canvas>
      </div>
    </div>

    <div class="final-time">
      <span class="label">FINAL TIME</span>
      <canvas id="finalTimeResult" class="result-canvas final-result-canvas" width="720" height="160"></canvas>
      <span class="unit">SECONDS</span>
    </div>

    <button id="restartBtn" class="primary" type="button">RESTART</button>
  </div>
</section>

<script>
(() => {
  const TOTAL_REACTIONS = 55;
  const WRONG_PENALTY_SECONDS = 1;

  const startScreen = document.getElementById("startScreen");
  const gameScreen = document.getElementById("gameScreen");
  const endScreen = document.getElementById("endScreen");

  const startBtn = document.getElementById("startBtn");
  const restartBtn = document.getElementById("restartBtn");
  const buttons = [...document.querySelectorAll(".control")];

  const reactionCount = document.getElementById("reactionCount");
  const mistakeCount = document.getElementById("mistakeCount");
  const hazardText = document.getElementById("hazardText");
  const instructionText = document.getElementById("instructionText");
  const statusText = document.getElementById("statusText");
  const roadWrap = document.getElementById("roadWrap");
  const car = document.getElementById("car");

  const reactionTimeResult = document.getElementById("reactionTimeResult");
  const penaltyResult = document.getElementById("penaltyResult");
  const finalTimeResult = document.getElementById("finalTimeResult");

  const actions = ["LEFT", "RIGHT", "BRAKE", "ACCELERATE"];

  const hazards = {
    LEFT: [
      "ROADBLOCK",
      "TRUCK AHEAD",
      "BLOCKED LANE",
      "CRATES",
      "POLICE BARRICADE",
      "STALLED CAR"
    ],
    RIGHT: [
      "ROADBLOCK",
      "ONCOMING CAR",
      "CLOSED LANE",
      "DEBRIS",
      "POLICE BARRICADE",
      "TRUCK AHEAD"
    ],
    BRAKE: [
      "RED LIGHT",
      "TRAIN CROSSING",
      "CAR CUTTING IN",
      "PEDESTRIAN",
      "SPIKE STRIP",
      "SUDDEN TURN"
    ],
    ACCELERATE: [
      "POLICE BEHIND",
      "CLOSING GATE",
      "RIVAL CAR",
      "AMBUSH",
      "TAILING CAR",
      "GETAWAY WINDOW"
    ]
  };

  let completed = 0;
  let mistakes = 0;
  let totalReactionMs = 0;
  let currentAction = null;
  let reactionStartedAt = 0;
  let waiting = false;
  let active = false;
  let nextPromptTimer = null;
  let feedbackTimer = null;
  let lastAction = null;

  function drawCanvasText(canvas, text, large = false) {
    const ctx = canvas.getContext("2d");
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#f0eadc";
    ctx.textAlign = large ? "center" : "right";
    ctx.textBaseline = "middle";
    ctx.font = large
      ? '900 96px "Courier New", monospace'
      : '900 30px "Courier New", monospace';

    ctx.shadowColor = "rgba(0,0,0,.95)";
    ctx.shadowBlur = 7;
    ctx.shadowOffsetY = 2;

    ctx.fillText(
      text,
      large ? w / 2 : w - 6,
      h / 2
    );
  }

  function showScreen(screen) {
    [startScreen, gameScreen, endScreen].forEach(el => el.classList.remove("active"));
    screen.classList.add("active");
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function chooseAction() {
    let options = actions;
    if (lastAction) {
      options = actions.filter(a => a !== lastAction);
    }
    const action = options[Math.floor(Math.random() * options.length)];
    lastAction = action;
    return action;
  }

  function chooseHazard(action) {
    const list = hazards[action];
    return list[Math.floor(Math.random() * list.length)];
  }

  function setControlsEnabled(enabled) {
    buttons.forEach(btn => btn.disabled = !enabled);
  }

  function clearTimers() {
    if (nextPromptTimer) clearTimeout(nextPromptTimer);
    if (feedbackTimer) clearTimeout(feedbackTimer);
    nextPromptTimer = null;
    feedbackTimer = null;
  }

  function resetGame() {
    clearTimers();
    completed = 0;
    mistakes = 0;
    totalReactionMs = 0;
    currentAction = null;
    reactionStartedAt = 0;
    waiting = false;
    active = false;
    lastAction = null;

    reactionCount.textContent = `0 / ${TOTAL_REACTIONS}`;
    mistakeCount.textContent = "0";
    hazardText.textContent = "";
    instructionText.textContent = "";
    instructionText.className = "instruction";
    statusText.textContent = "";
    statusText.className = "status";
    car.className = "car";
    roadWrap.classList.remove("shake", "braking", "accelerating");
    setControlsEnabled(false);
  }

  function startGame() {
    resetGame();
    active = true;
    showScreen(gameScreen);
    scheduleNextPrompt();
  }

  function scheduleNextPrompt() {
    if (!active) return;

    waiting = true;
    currentAction = null;
    setControlsEnabled(false);
    hazardText.textContent = "";
    instructionText.textContent = "";
    instructionText.className = "instruction";
    statusText.textContent = "";
    statusText.className = "status";
    car.className = "car";
    roadWrap.classList.remove("braking", "accelerating");

    const delay = randomInt(1000, 5000);
    nextPromptTimer = setTimeout(showPrompt, delay);
  }

  function showPrompt() {
    if (!active) return;

    waiting = false;
    currentAction = chooseAction();
    const hazard = chooseHazard(currentAction);

    hazardText.textContent = hazard;
    instructionText.textContent = currentAction + "!";
    instructionText.className = "instruction show";
    setControlsEnabled(true);

    reactionStartedAt = performance.now();
  }

  function animateCar(action) {
    roadWrap.classList.remove("braking", "accelerating");
    car.className = "car";

    void car.offsetWidth;
    void roadWrap.offsetWidth;

    if (action === "BRAKE") {
      roadWrap.classList.add("braking");
    } else if (action === "ACCELERATE") {
      roadWrap.classList.add("accelerating");
    }

    car.classList.add(action.toLowerCase());

    setTimeout(() => {
      car.className = "car";
      roadWrap.classList.remove("braking", "accelerating");
    }, 1000);
  }

  function flashWrong() {
    instructionText.classList.add("wrong");
    statusText.textContent = "+1.000 s";
    statusText.classList.add("show");

    roadWrap.classList.remove("shake");
    void roadWrap.offsetWidth;
    roadWrap.classList.add("shake");

    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
      instructionText.classList.remove("wrong");
      statusText.classList.remove("show");
      roadWrap.classList.remove("shake");
    }, 350);
  }

  function handleAction(action, button) {
    if (!active || waiting || !currentAction) return;

    button.classList.add("pressed");
    setTimeout(() => button.classList.remove("pressed"), 90);

    if (action !== currentAction) {
      mistakes++;
      mistakeCount.textContent = String(mistakes);
      flashWrong();
      return;
    }

    const reactionMs = performance.now() - reactionStartedAt;
    totalReactionMs += reactionMs;
    completed++;
    reactionCount.textContent = `${completed} / ${TOTAL_REACTIONS}`;

    setControlsEnabled(false);
    animateCar(action);

    hazardText.textContent = "";
    instructionText.textContent = "";
    instructionText.className = "instruction";
    statusText.textContent = "";
    statusText.className = "status";

    currentAction = null;

    const settleDelay = 1040;

    if (completed >= TOTAL_REACTIONS) {
      setTimeout(endGame, settleDelay);
    } else {
      setTimeout(scheduleNextPrompt, settleDelay);
    }
  }

  function endGame() {
    active = false;
    clearTimers();
    setControlsEnabled(false);

    const reactionSeconds = totalReactionMs / 1000;
    const penaltySeconds = mistakes * WRONG_PENALTY_SECONDS;
    const finalSeconds = reactionSeconds + penaltySeconds;

    drawCanvasText(reactionTimeResult, `${reactionSeconds.toFixed(3)} s`);
    drawCanvasText(penaltyResult, `${mistakes} × ${WRONG_PENALTY_SECONDS.toFixed(3)} s`);
    drawCanvasText(finalTimeResult, finalSeconds.toFixed(3), true);

    showScreen(endScreen);
  }

  buttons.forEach(button => {
    button.addEventListener("pointerdown", event => {
      event.preventDefault();
      handleAction(button.dataset.action, button);
    });
  });

  startBtn.addEventListener("click", startGame);
  restartBtn.addEventListener("click", startGame);

  document.addEventListener("contextmenu", event => {
    event.preventDefault();
  });

  document.addEventListener("dragstart", event => {
    event.preventDefault();
  });

  document.addEventListener("selectstart", event => {
    event.preventDefault();
  });

  document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();
    const blocked =
      event.key === "F12" ||
      (event.ctrlKey && event.shiftKey && ["i", "j", "c", "k"].includes(key)) ||
      (event.ctrlKey && ["u", "s"].includes(key)) ||
      (event.metaKey && event.altKey && ["i", "j", "c"].includes(key));

    if (blocked) {
      event.preventDefault();
      event.stopPropagation();
      return false;
    }
  }, true);
drawCanvasText(reactionTimeResult, "0.000 s");
  drawCanvasText(penaltyResult, "0 × 1.000 s");
  drawCanvasText(finalTimeResult, "0.000", true);
})();
</script>
</body>
</html>
